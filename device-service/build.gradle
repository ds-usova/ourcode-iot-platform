plugins {
    id "java"
    id "jacoco"
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$springDependencyManagementVersion"
    id "org.openapi.generator" version "$openApiGeneratorVersion"
}

group = "org.ourcode"
version = "$appVersion"
description = "device-service"

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()

    maven {
        allowInsecureProtocol = true

        def nexusHost = findProperty("nexus_host") ?: "localhost:8081"
        url = uri("http://${nexusHost}/repository/iot-libs-release-local")

        credentials {
            username = findProperty("nexus_user") ?: "admin"
            password = findProperty("nexus_password") ?: "fdfaec4c-c569-4835-a0cd-d51e5d4500e9"
        }
    }
}

dependencies {
    // Web
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    implementation "io.swagger.core.v3:swagger-annotations:2.2.15"

    // PostgreSQL
    implementation "org.springframework.boot:spring-boot-starter-data-jdbc"
    implementation "org.apache.shardingsphere:shardingsphere-jdbc:${shardingJdbcVersion}"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-database-postgresql"
    runtimeOnly "org.postgresql:postgresql"

    // Observability
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "io.micrometer:micrometer-registry-prometheus"

    // Retry
    implementation "org.springframework.retry:spring-retry"
    implementation "org.springframework.boot:spring-boot-starter-aop"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Logging
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"

    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:toxiproxy"
    testImplementation "org.testcontainers:postgresql"
    testImplementation "com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}"

    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-path:${restAssuredVersion}"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set(file("src/main/resources/interface/device-service.yaml").toURI().toString())

    modelPackage.set("org.ourcode.rest.model")
    apiPackage.set("org.ourcode.rest.api")

    generateApiDocumentation.set(false)
    generateApiTests.set(false)
    generateModelDocumentation.set(false)
    generateModelTests.set(false)

    configOptions.set([
            basePackage            : "org.ourcode.generated",
            interfaceOnly          : "true",
            dateLibrary            : "java8",
            openApiNullable        : "false",
            serializableModel      : "true",
            library                : "spring-boot",
            useBeanValidation      : "true",
            useJakartaEe           : "true",
            useTags                : "true",
    ])
}

sourceSets.main.java.srcDir "${buildDir}/generate-resources/main/src/main/java"

compileJava.dependsOn tasks.openApiGenerate

tasks.named("test") {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = configurations.annotationProcessor
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                "**/org/ourcode/rest/**",
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/org/ourcode/rest/**",
            ])
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification
