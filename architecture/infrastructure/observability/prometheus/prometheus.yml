global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'prometheus:9090' ]

  - job_name: 'postgres'
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: /metrics

  - job_name: 'postgres-shard-0'
    static_configs:
      - targets: [ 'postgres-exporter-shard-0:9187' ]
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: /metrics

  - job_name: 'postgres-shard-1'
    static_configs:
      - targets: [ 'postgres-exporter-shard-1:9187' ]
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: /metrics

  - job_name: 'postgres-shard-0-replica'
    static_configs:
      - targets: [ 'postgres-exporter-shard-0-replica:9187' ]
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: /metrics

  - job_name: 'postgres-shard-1-replica'
    static_configs:
      - targets: [ 'postgres-exporter-shard-1-replica:9187' ]
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: /metrics

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'event-collector'
    static_configs:
      - targets: [ 'event-collector:8090' ]
    scrape_interval: 10s
    metrics_path: /actuator/prometheus

  - job_name: 'device-collector'
    static_configs:
      - targets: [ 'device-collector:8090' ]
    scrape_interval: 10s
    metrics_path: /actuator/prometheus

  - job_name: 'device-service'
    static_configs:
      - targets: [ 'device-service:8090' ]
    scrape_interval: 10s
    metrics_path: /actuator/prometheus

  - job_name: 'failed-events-processor'
    static_configs:
      - targets: [ 'failed-events-processor:8090' ]
    scrape_interval: 10s
    metrics_path: /actuator/prometheus

  - job_name: 'minio-cluster'
    static_configs:
      - targets: [ 'minio:9000' ]
    scrape_interval: 10s
    metrics_path: /minio/v2/metrics/cluster

  - job_name: 'minio-bucket'
    static_configs:
      - targets: [ 'minio:9000' ]
    scrape_interval: 10s
    metrics_path: /minio/v2/metrics/bucket

  - job_name: 'minio-node'
    static_configs:
      - targets: [ 'minio:9000' ]
    scrape_interval: 10s
    metrics_path: /minio/v2/metrics/node