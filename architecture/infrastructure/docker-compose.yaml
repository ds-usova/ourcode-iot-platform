x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB_NAME}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"

x-postgres-base: &postgres-base
  image: postgres:17.5
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  deploy:
    resources:
      limits:
        memory: 256M
  networks:
    - backend

x-postgres-exporter: &postgres-exporter
  image: prometheuscommunity/postgres-exporter:latest
  networks:
    - backend
  healthcheck:
    test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics" ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  # Persistence
  postgres:
    <<: *postgres-base
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      <<: *postgres-env
      # Keycloak database configuration
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
      # Camunda database configuration
      CAMUNDA_DB_USER: ${CAMUNDA_DB_USER}
      CAMUNDA_DB_PASSWORD: ${CAMUNDA_DB_PASSWORD}
      CAMUNDA_DB_SCHEMA: ${CAMUNDA_DB_SCHEMA}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-postgres.sh:/docker-entrypoint-initdb.d/init-db.sh

  postgres_shard_0:
    <<: *postgres-base
    container_name: postgres_shard_0
    ports:
      - "5433:5432"
    environment:
      <<: *postgres-env
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - ./db/sharding/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
      - postgres_shard_0_data:/var/lib/postgresql/data

  postgres_shard_0_replica:
    <<: *postgres-base
    container_name: postgres_shard_0_replica
    ports:
      - "5435:5432"
    environment:
      <<: *postgres-env
      PGUSER: ${POSTGRES_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PRIMARY: postgres_shard_0
    volumes:
      - ./db/sharding/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
      - postgres_shard_0_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres_shard_0:
        condition: service_healthy

  postgres_shard_1:
    <<: *postgres-base
    container_name: postgres_shard_1
    ports:
      - "5434:5432"
    environment:
      <<: *postgres-env
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - ./db/sharding/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
      - postgres_shard_1_data:/var/lib/postgresql/data

  postgres_shard_1_replica:
    <<: *postgres-base
    container_name: postgres_shard_1_replica
    ports:
      - "5436:5432"
    environment:
      <<: *postgres-env
      PGUSER: ${POSTGRES_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PRIMARY: postgres_shard_1
    volumes:
      - ./db/sharding/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
      - postgres_shard_1_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres_shard_1:
        condition: service_healthy

  redis:
    image: redis:8.2
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "cqlsh", "-e", "SHOW HOST" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cassandra-load-keyspace:
    image: cassandra:5.0
    container_name: cassandra-load-keyspace
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - ./db/init-cassandra.cql:/schema.cql
    command: /bin/bash -c "cqlsh cassandra -f /schema.cql"

  # Kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka_init
    networks:
      - backend
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ['/bin/bash', '/create-topics.sh']
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    networks:
      - backend
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - backend
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    ports:
      - "8083:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - backend
    command:
      - start-dev
      - --import-realm
    environment:
      KC_HOSTNAME: "localhost"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Curl is no longer available in Keycloak 26, using CMD-SHELL for healthcheck
      test: [ "CMD-SHELL", "exec 3<> /dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  camunda:
    image: camunda/camunda-bpm-platform:tomcat-7.23.0
    container_name: camunda
    ports:
      - "8084:8080"
    networks:
      - backend
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME}?currentSchema=${CAMUNDA_DB_SCHEMA}
      DB_USERNAME: ${CAMUNDA_DB_USER}
      DB_PASSWORD: ${CAMUNDA_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/engine-rest/engine" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  schema-registry:
    image: bitnami/schema-registry:8.0
    container_name: schema-registry
    ports:
      - "8086:8081"
    environment:
      SCHEMA_REGISTRY_KAFKA_BROKERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_AVRO_COMPATIBILY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_DEBUG: "true"
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy

  # Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=:9090"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - backend
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    user: "root"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_chunks:/tmp/loki/chunks
      - loki_index:/tmp/loki/index
      - loki_rules:/tmp/loki/rules
    networks:
      - backend

  alloy:
    image: grafana/alloy:v1.12.0
    container_name: alloy
    user: root
    ports:
      - "9080:9080"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_started
    networks:
      - backend

  postgres-exporter:
    <<: *postgres-exporter
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter-shard-0:
    <<: *postgres-exporter
    container_name: postgres-exporter-shard-0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_shard_0:5432/${POSTGRES_DB_NAME}?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      postgres_shard_0:
        condition: service_healthy

  postgres-exporter-shard-1:
    <<: *postgres-exporter
    container_name: postgres-exporter-shard-1
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_shard_1:5432/${POSTGRES_DB_NAME}?sslmode=disable"
    ports:
      - "9189:9187"
    depends_on:
      postgres_shard_1:
        condition: service_healthy

  postgres-exporter-shard-0-replica:
    <<: *postgres-exporter
    container_name: postgres-exporter-shard-0-replica
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_shard_0_replica:5432/${POSTGRES_DB_NAME}?sslmode=disable"
    ports:
      - "9190:9187"
    depends_on:
      postgres_shard_0_replica:
        condition: service_healthy

  postgres-exporter-shard-1-replica:
    <<: *postgres-exporter
    container_name: postgres-exporter-shard-1-replica
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_shard_1_replica:5432/${POSTGRES_DB_NAME}?sslmode=disable"
    ports:
      - "9191:9187"
    depends_on:
      postgres_shard_1_replica:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9308/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nexus Repository Manager
  nexus:
    image: sonatype/nexus3:3.87.1
    container_name: nexus
    ports:
      - "8081:8081"
      - "8085:8085"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - backend
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=273m"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nexus-init:
    image: curlimages/curl:latest
    container_name: nexus-init
    entrypoint: [ "/usr/bin/env", "sh", "/init-nexus.sh" ]
    environment:
      NEXUS_PASSWORD: ${NEXUS_PASSWORD}
    volumes:
      - nexus_data:/nexus-data:ro
      - ./nexus/init-nexus.sh:/init-nexus.sh:ro
    networks:
      - backend
    depends_on:
      nexus:
        condition: service_healthy
    restart: "no"

  # Applications
  event-collector:
    image: event-collector:latest
    container_name: event-collector
    ports:
      - "8090:8090"
    build:
      context: ./../../event-collector
      network: host
      args:
        NEXUS_HOST: nexus:8081
        NEXUS_ADMIN: ${NEXUS_ADMIN}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
      cassandra:
        condition: service_healthy
      cassandra-load-keyspace:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: 9042

  avro-schemas:
    image: avro-schemas:latest
    container_name: avro-schemas
    build:
      context: ./../../avro-schemas
      network: host
      args:
        NEXUS_HOST: nexus:8081
        NEXUS_ADMIN: ${NEXUS_ADMIN}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}

  rest-clients:
    image: rest-clients:latest
    build:
      context: ./../../rest-clients
      network: host
      args:
        NEXUS_HOST: nexus:8081
        NEXUS_ADMIN: ${NEXUS_ADMIN}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}

  device-collector:
    image: device-collector:latest
    container_name: device-collector
    ports:
      - "8091:8090"
    build:
      context: ./../../device-collector
      network: host
      args:
        NEXUS_HOST: nexus:8081
        NEXUS_ADMIN: ${NEXUS_ADMIN}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}
    networks:
      - backend
    depends_on:
      nexus:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
      postgres_shard_0:
        condition: service_healthy
      postgres_shard_0_replica:
        condition: service_healthy
      postgres_shard_1:
        condition: service_healthy
      postgres_shard_1_replica:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Shard 0
      SHARD_0_JDBC_URL: jdbc:postgresql://postgres_shard_0:5432/${POSTGRES_DB_NAME}
      SHARD_0_USER: ${POSTGRES_USER}
      SHARD_0_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_0_CONNECTION_TIMEOUT: 30000
      # Shard 0 replica
      SHARD_0_REPLICA_JDBC_URL: jdbc:postgresql://postgres_shard_0_replica:5432/${POSTGRES_DB_NAME}
      SHARD_0_REPLICA_USER: ${POSTGRES_USER}
      SHARD_0_REPLICA_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_0_REPLICA_CONNECTION_TIMEOUT: 30000
      # Shard 1
      SHARD_1_JDBC_URL: jdbc:postgresql://postgres_shard_1:5432/${POSTGRES_DB_NAME}
      SHARD_1_USER: ${POSTGRES_USER}
      SHARD_1_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_1_CONNECTION_TIMEOUT: 30000
      # Shard 1 replica
      SHARD_1_REPLICA_JDBC_URL: jdbc:postgresql://postgres_shard_1_replica:5432/${POSTGRES_DB_NAME}
      SHARD_1_REPLICA_USER: ${POSTGRES_USER}
      SHARD_1_REPLICA_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_1_REPLICA_CONNECTION_TIMEOUT: 30000

  device-service:
    image: device-service:latest
    container_name: device-service
    ports:
      - "8092:8090"
    build:
      context: ./../../device-service
      network: host
      args:
        NEXUS_HOST: nexus:8081
        NEXUS_ADMIN: ${NEXUS_ADMIN}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}
    networks:
      - backend
    depends_on:
      nexus:
        condition: service_healthy
      postgres_shard_0:
        condition: service_healthy
      postgres_shard_0_replica:
        condition: service_healthy
      postgres_shard_1:
        condition: service_healthy
      postgres_shard_1_replica:
        condition: service_healthy
      # disabled because API is not protected
      # keycloak:
      #   condition: service_healthy
    environment:
      #ISSUER_URI: http://keycloak:8080/realms/our-code
      DEVICE_SERVICE_API_PROTECTED: false
      # Shard 0
      SHARD_0_JDBC_URL: jdbc:postgresql://postgres_shard_0:5432/${POSTGRES_DB_NAME}
      SHARD_0_USER: ${POSTGRES_USER}
      SHARD_0_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_0_CONNECTION_TIMEOUT: 5000
      # Shard 0 replica
      SHARD_0_REPLICA_JDBC_URL: jdbc:postgresql://postgres_shard_0_replica:5432/${POSTGRES_DB_NAME}
      SHARD_0_REPLICA_USER: ${POSTGRES_USER}
      SHARD_0_REPLICA_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_0_REPLICA_CONNECTION_TIMEOUT: 5000
      # Shard 1
      SHARD_1_JDBC_URL: jdbc:postgresql://postgres_shard_1:5432/${POSTGRES_DB_NAME}
      SHARD_1_USER: ${POSTGRES_USER}
      SHARD_1_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_1_CONNECTION_TIMEOUT: 5000
      # Shard 1 replica
      SHARD_1_REPLICA_JDBC_URL: jdbc:postgresql://postgres_shard_1_replica:5432/${POSTGRES_DB_NAME}
      SHARD_1_REPLICA_USER: ${POSTGRES_USER}
      SHARD_1_REPLICA_PASSWORD: ${POSTGRES_PASSWORD}
      SHARD_1_REPLICA_CONNECTION_TIMEOUT: 5000

  failed-events-processor:
      image: failed-events-processor:latest
      container_name: failed-events-processor
      ports:
          - "8093:8090"
      build:
        context: ./../../failed-events-processor
        network: host
        args:
          NEXUS_HOST: nexus:8081
          NEXUS_ADMIN: ${NEXUS_ADMIN}
          NEXUS_PASSWORD: ${NEXUS_PASSWORD}
      networks:
          - backend
      depends_on:
        nexus:
          condition: service_healthy
        kafka:
          condition: service_healthy
        kafka-init:
          condition: service_completed_successfully
        schema-registry:
          condition: service_started
        minio:
          condition: service_healthy
      environment:
        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
